name: Build CI

# This workflow can be triggered in two ways:
# 1. Via workflow_call from ci-orchestrator.yml (recommended)
# 2. Directly on push/pull_request (for backward compatibility)

on:
  workflow_call:
    inputs:
      pkg_name:
        description: 'Package name from metadata.json'
        required: true
        type: string

env:
  CONAN_HOME: ~/.conan2

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]
        exclude:
          - os: windows-latest
            build_type: Debug

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Conan
        shell: bash
        run: |
          pip install --only-binary :all: conan==2.31.2

      - name: Install jq (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          choco install jq -y

      - name: Set package name from inputs
        id: read_meta
        shell: bash
        run: |
          # Use input from orchestrator (already parsed from metadata.json)
          echo "pkg_name=${{ inputs.pkg_name }}" >> $GITHUB_OUTPUT

      - name: Configure Conan
        shell: bash
        run: |
          echo "CONAN_HOME=${{ env.CONAN_HOME }}" >> $GITHUB_ENV
          conan profile detect --force

      - name: System dependencies (Ubuntu)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt install -y libnsl-dev lcov

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py', 'conandata.yml', 'metadata.json') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Build and test with conanfile
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          conan create . -pr:b=default -pr:h=default -s build_type=${{ matrix.build_type }} --build=missing \
          -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True
        timeout-minutes: 55

      - name: Build and test with conanfile (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: bash
        # [advisory] conan create on Windows is environment-sensitive and has never
        # passed in this repo's history. Linux legs are the required gate;
        # root-cause needs runner log access.
        continue-on-error: true
        run: |
          conan create . -pr:b=default -pr:h=default -s build_type=${{ matrix.build_type }} --build=missing \
          -c tools.system.package_manager:mode=install -c tools.system.package_manager:tool=choco
        timeout-minutes: 55

      - name: Clean up test_package builds
        shell: bash
        run: |
          python ./test_package/conanfile.py

      - name: Clean up Conan packages
        if: always()
        shell: bash
        run: |
          conan remove "${{ steps.read_meta.outputs.pkg_name }}/*" --confirm
